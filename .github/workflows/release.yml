# Release on a version tag: images to GHCR, the CLI to npm, both carrying the tag's version.
#   git tag v0.1.0 && git push origin v0.1.0
# npm uses trusted publishing (OIDC): configure @rasmusgodske/lore on npmjs.com to trust
# this repository and this workflow file; no NPM_TOKEN secret is needed.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build && npm test

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ghcr.io/rasmusgodske/lore-server:${{ steps.version.outputs.v }}
            ghcr.io/rasmusgodske/lore-server:latest
      - uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: true
          tags: |
            ghcr.io/rasmusgodske/lore-sandbox:${{ steps.version.outputs.v }}
            ghcr.io/rasmusgodske/lore-sandbox:latest

  npm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org, cache: npm }
      - run: npm ci && npm run build -w packages/cli
      - name: set the version from the tag
        run: cd packages/cli && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: cd packages/cli && npm publish --access public --provenance
