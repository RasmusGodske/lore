# Local development. On the VM the same shape applies with LORE_SANDBOX_RUNTIME=runsc.
services:
  orchestrator:
    # Local development builds from source (`docker compose up --build`); a deployment pulls the
    # published image for a version (`LORE_VERSION=0.1.0 docker compose pull && up -d`).
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: ghcr.io/rasmusgodske/lore-server:${LORE_VERSION:-latest}
    container_name: lore-server
    restart: unless-stopped
    ports:
      - "${LORE_PUBLIC_BIND:-0.0.0.0}:${LORE_PUBLIC_PORT:-8480}:8080"
    environment:
      LORE_DATA_DIR: /srv/lore
      LORE_HOST_DATA_DIR: ${LORE_HOST_DATA_DIR:-${PWD}/data}
      LORE_SANDBOX_RUNTIME: ${LORE_SANDBOX_RUNTIME:-runc}
      LORE_SANDBOX_IMAGE: ghcr.io/rasmusgodske/lore-sandbox:${LORE_VERSION:-latest}
      LORE_SANDBOX_NETWORK: lore-net
      LORE_SERVER_HOST: lore-server
      LORE_LOG_LEVEL: ${LORE_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LORE_HOST_DATA_DIR:-${PWD}/data}:/srv/lore
    networks:
      - default
      - lore-net
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  # Builds the sandbox image and exits; sessions run from lore-sandbox:latest.
  sandbox-image:
    build: ./sandbox
    image: ghcr.io/rasmusgodske/lore-sandbox:${LORE_VERSION:-latest}
    command: ["true"]
    restart: "no"

networks:
  default: {}
  lore-net:
    name: lore-net
    internal: true
    driver_opts:
      # Fixed bridge name so the host firewall can refuse traffic from sandboxes to the host
      # itself (an internal network stops routing out, not reaching the host's own services).
      com.docker.network.bridge.name: lore-net
